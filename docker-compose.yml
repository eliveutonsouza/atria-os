# Nome do projeto (prefixo de containers, volumes, imagens e router do Traefik). Mude só para rodar
# uma segunda instalação na mesma VPS (ex.: teste); trocar numa instalação existente cria volumes novos e vazios.
name: ${YUI_PROJECT:-yui-console}

services:
  yui-console:
    build: .
    image: ${YUI_PROJECT:-yui-console}:local
    restart: unless-stopped
    env_file: [.env]
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      YUI_DOCKER_API: http://yui-dockerproxy:2375
      YUI_HOST_PROC: /host/proc
      YUI_BROWSER_CDP: http://yui-browser:9223
      YUI_PG_URL: postgres://yui:${YUI_PG_PASSWORD:?defina YUI_PG_PASSWORD}@yui-postgres:5432/yui
      YUI_QDRANT_URL: http://yui-qdrant:6333
      YUI_QDRANT_KEY: ${YUI_QDRANT_KEY:?defina YUI_QDRANT_KEY}
      YUI_DOCLING_URL: http://yui-docling:5001
    volumes:
      - yui-data:/data
      - yui-workspace:/workspace
      - /proc:/host/proc:ro
    expose:
      - "8080"
    mem_limit: 2g
    cpus: "2.0"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - yui-dockerproxy
      - yui-code
      - yui-postgres
      - yui-qdrant
    labels:
      # Usadas só quando há um Traefik na VPS (YUI_PROXY=traefik). Com caddy/none, YUI_TRAEFIK_ENABLE=false.
      - traefik.enable=${YUI_TRAEFIK_ENABLE:-true}
      - traefik.http.routers.${YUI_PROJECT:-yui-console}.rule=Host(`${YUI_DOMAIN}`)
      - traefik.http.routers.${YUI_PROJECT:-yui-console}.entrypoints=${YUI_TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${YUI_PROJECT:-yui-console}.tls.certresolver=${YUI_TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.${YUI_PROJECT:-yui-console}.service=${YUI_PROJECT:-yui-console}
      - traefik.http.services.${YUI_PROJECT:-yui-console}.loadbalancer.server.port=8080

  # Navegador headless para os agentes (Playwright MCP via HTTP). Perfil persistente: logins feitos
  # pelos agentes sobrevivem a reinícios. Monta o mesmo workspace: screenshots/PDFs caem no projeto do agente (caminho relativo) ou em /workspace/.yui/browser.
  yui-browser:
    image: mcr.microsoft.com/playwright/mcp@sha256:77dccc5ce9e94cb8ae7ebea87ddbb6cd54b05760c4d63c54e16accf2726b8734 # v0.0.82
    restart: unless-stopped
    # Chromium com CDP (9223 via proxy, assistido ao vivo pelo console) + Playwright MCP (8931) ligado a ele.
    entrypoint: ["/bin/sh", "/browser/entrypoint.sh"]
    user: "0" # volume do perfil nasce root; chromium já roda com --no-sandbox num container isolado
    volumes:
      - yui-browser-profile:/profile
      - yui-workspace:/workspace
      - ./browser:/browser:ro
    shm_size: 1g
    mem_limit: 1g
    labels:
      - traefik.enable=false

  # VS Code open source para o Vault e os projetos. Sem porta pública nem Traefik: o yui-console
  # checa a sessão e repassa /code (HTTP + WebSocket). Mesmo uid (1000) do console no volume.
  yui-code:
    build: ./code
    image: ${YUI_PROJECT:-yui-console}-code:local
    restart: unless-stopped
    volumes:
      - yui-workspace:/workspace
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    mem_limit: 1536m
    cpus: "1.5"
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=false

  # Base de conhecimento da Empresa: documentos, páginas, trechos e campos extraídos (Postgres),
  # vetores (Qdrant) e leitura/OCR de arquivos (Docling). Tudo interno, sem porta pública.
  yui-postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: yui
      POSTGRES_DB: yui
      POSTGRES_PASSWORD: ${YUI_PG_PASSWORD:?defina YUI_PG_PASSWORD}
    volumes:
      - yui-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yui -d yui"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    labels:
      - traefik.enable=false

  yui-qdrant:
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${YUI_QDRANT_KEY:?defina YUI_QDRANT_KEY}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - yui-qdrant:/qdrant/storage
    mem_limit: 768m
    labels:
      - traefik.enable=false

  yui-docling:
    image: quay.io/docling-project/docling-serve-cpu@sha256:225c8586e20d5d0fc6811a9e0e044fa602bcc4393f00389009bad42d6787b58f
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_MAX_SYNC_WAIT: "600"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      OMP_NUM_THREADS: "2"
    mem_limit: 3g
    cpus: "2.0"
    labels:
      - traefik.enable=false

  # TLS automático para VPS sem proxy próprio (profile "edge", ativado pelo install.sh quando não há Traefik).
  # Com Traefik já rodando no host, este serviço fica desligado e valem as labels do yui-console.
  yui-caddy:
    image: caddy:2.11-alpine
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      YUI_DOMAIN: ${YUI_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - yui-caddy-data:/data
      - yui-caddy-config:/config
    depends_on:
      - yui-console
    mem_limit: 128m
    labels:
      - traefik.enable=false

  # Docker API somente leitura (lista containers + logs) para Infra/Logs. O app nunca recebe o socket.
  yui-dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    labels:
      - traefik.enable=false

volumes:
  yui-pg:
  yui-qdrant:
  yui-caddy-data:
  yui-caddy-config:
  yui-data:
  yui-workspace:
  yui-browser-profile:
