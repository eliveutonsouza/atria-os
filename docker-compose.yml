name: yui-console

services:
  yui-console:
    build: .
    image: yui-console:local
    restart: unless-stopped
    env_file: [.env]
    environment:
      TZ: America/Sao_Paulo
      YUI_DOCKER_API: http://yui-dockerproxy:2375
      YUI_HOST_PROC: /host/proc
      YUI_BROWSER_CDP: http://yui-browser:9223
    volumes:
      - yui-data:/data
      - yui-workspace:/workspace
      - /proc:/host/proc:ro
    expose:
      - "8080"
    mem_limit: 2g
    cpus: "2.0"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - yui-dockerproxy
      - yui-code
    labels:
      - traefik.enable=true
      - traefik.http.routers.yui-console.rule=Host(`${YUI_DOMAIN}`)
      - traefik.http.routers.yui-console.entrypoints=${YUI_TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.yui-console.tls.certresolver=${YUI_TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.yui-console.service=yui-console
      - traefik.http.services.yui-console.loadbalancer.server.port=8080

  # Navegador headless para os agentes (Playwright MCP via HTTP). Perfil persistente: logins feitos
  # pelos agentes sobrevivem a reinícios. Monta o mesmo workspace: screenshots/PDFs caem no projeto do agente (caminho relativo) ou em /workspace/.yui/browser.
  yui-browser:
    image: mcr.microsoft.com/playwright/mcp@sha256:77dccc5ce9e94cb8ae7ebea87ddbb6cd54b05760c4d63c54e16accf2726b8734 # v0.0.82
    restart: unless-stopped
    # Chromium com CDP (9223 via proxy, assistido ao vivo pelo console) + Playwright MCP (8931) ligado a ele.
    entrypoint: ["/bin/sh", "/browser/entrypoint.sh"]
    user: "0" # volume do perfil nasce root; chromium já roda com --no-sandbox num container isolado
    volumes:
      - yui-browser-profile:/profile
      - yui-workspace:/workspace
      - ./browser:/browser:ro
    shm_size: 1g
    mem_limit: 1g
    labels:
      - traefik.enable=false

  # VS Code open source para o Vault e os projetos. Sem porta pública nem Traefik: o yui-console
  # checa a sessão e repassa /code (HTTP + WebSocket). Mesmo uid (1000) do console no volume.
  yui-code:
    build: ./code
    image: yui-code:local
    restart: unless-stopped
    volumes:
      - yui-workspace:/workspace
    environment:
      TZ: America/Sao_Paulo
    mem_limit: 1536m
    cpus: "1.5"
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=false

  # TLS automático para VPS sem proxy próprio (profile "edge", ativado pelo install.sh quando não há Traefik).
  # Com Traefik já rodando no host, este serviço fica desligado e valem as labels do yui-console.
  yui-caddy:
    image: caddy:2.11-alpine
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      YUI_DOMAIN: ${YUI_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - yui-caddy-data:/data
      - yui-caddy-config:/config
    depends_on:
      - yui-console
    mem_limit: 128m
    labels:
      - traefik.enable=false

  # Docker API somente leitura (lista containers + logs) para Infra/Logs. O app nunca recebe o socket.
  yui-dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    labels:
      - traefik.enable=false

volumes:
  yui-caddy-data:
  yui-caddy-config:
  yui-data:
  yui-workspace:
  yui-browser-profile:
