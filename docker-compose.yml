name: yui-console

services:
  yui-console:
    build: .
    image: yui-console:local
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      YUI_DOCKER_API: http://yui-dockerproxy:2375
      YUI_HOST_PROC: /host/proc
    volumes:
      - yui-data:/data
      - yui-workspace:/workspace
      - /proc:/host/proc:ro
    expose:
      - "8080"
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    depends_on:
      - yui-dockerproxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.yui-console.rule=Host(`${YUI_DOMAIN}`)
      - traefik.http.routers.yui-console.entrypoints=websecure
      - traefik.http.routers.yui-console.tls.certresolver=letsencrypt
      - traefik.http.routers.yui-console.service=yui-console
      - traefik.http.services.yui-console.loadbalancer.server.port=8080

  # Docker API somente leitura (lista containers + logs) para Infra/Logs. O app nunca recebe o socket.
  yui-dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    labels:
      - traefik.enable=false

volumes:
  yui-data:
  yui-workspace:
