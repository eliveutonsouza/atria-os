# Nome do projeto (prefixo de containers, volumes, imagens e router do Traefik). Mude só para rodar
# uma segunda instalação na mesma VPS (ex.: teste); trocar numa instalação existente cria volumes novos e vazios.
name: ${ATRIA_PROJECT:-atria-os}

# Imagens prontas do GHCR na versão ATRIA_TAG (vX.Y.Z; o atualizador troca esse valor no .env).
# ATRIA_REGISTRY troca o registro (padrão ghcr.io/eliveutonsouza; útil para testes com um registro local).
# Instalação a partir do código (install.sh, scripts-deploy.sh) soma o docker-compose.build.yml, que builda aqui
# com imagens :local. Instalação por imagem (deploy/install-release.sh) usa este arquivo como está.
services:
  atria:
    image: ${ATRIA_REGISTRY:-ghcr.io/eliveutonsouza}/atria-os:${ATRIA_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      ATRIA_DOCKER_API: http://atria-dockerproxy:2375
      ATRIA_HOST_PROC: /host/proc
      ATRIA_BROWSER_CDP: http://atria-browser:9223
      ATRIA_PG_URL: postgres://yui:${ATRIA_PG_PASSWORD:?defina ATRIA_PG_PASSWORD (instalação antiga com YUI_* = rode ./install.sh --update de novo)}@atria-postgres:5432/yui
      ATRIA_QDRANT_URL: http://atria-qdrant:6333
      ATRIA_QDRANT_KEY: ${ATRIA_QDRANT_KEY:?defina ATRIA_QDRANT_KEY (instalação antiga com YUI_* = rode ./install.sh --update de novo)}
      ATRIA_DOCLING_URL: http://atria-docling:5001
      # Atualização remota pelo Atria Central (só responde com o profile "updater" ligado)
      ATRIA_UPDATER_URL: ${ATRIA_UPDATER_URL:-http://atria-updater:8787}
      ATRIA_UPDATER_TOKEN: ${ATRIA_UPDATER_TOKEN:-}
    volumes:
      - data:/data
      - workspace:/workspace
      - /proc:/host/proc:ro
    expose:
      - "8080"
    mem_limit: 3g
    cpus: "2.0"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - atria-dockerproxy
      - atria-code
      - atria-postgres
      - atria-qdrant
    labels:
      # Usadas só quando há um Traefik na VPS (ATRIA_PROXY=traefik). Com caddy/none, ATRIA_TRAEFIK_ENABLE=false.
      - traefik.enable=${ATRIA_TRAEFIK_ENABLE:-true}
      - traefik.http.routers.${ATRIA_PROJECT:-atria-os}.rule=Host(`${ATRIA_DOMAIN}`)
      - traefik.http.routers.${ATRIA_PROJECT:-atria-os}.entrypoints=${ATRIA_TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${ATRIA_PROJECT:-atria-os}.tls.certresolver=${ATRIA_TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.${ATRIA_PROJECT:-atria-os}.service=${ATRIA_PROJECT:-atria-os}
      - traefik.http.services.${ATRIA_PROJECT:-atria-os}.loadbalancer.server.port=8080

  # Navegador dos agentes (Playwright MCP via HTTP) com Chrome de verdade numa tela virtual (Xvfb), não headless
  # (browser/Dockerfile). Perfil persistente: logins feitos pelos agentes sobrevivem a reinícios. Monta o mesmo
  # workspace: screenshots/PDFs caem no projeto do agente (caminho relativo) ou em /workspace/.atria/browser.
  atria-browser:
    image: ${ATRIA_REGISTRY:-ghcr.io/eliveutonsouza}/atria-browser:${ATRIA_TAG:-latest}
    restart: unless-stopped
    # Chrome com CDP (9223 via proxy, assistido ao vivo pelo Atria OS) + Playwright MCP (8931) ligado a ele.
    user: "0" # volume do perfil nasce root; o navegador já roda com --no-sandbox num container isolado
    init: true # recolhe processos órfãos do navegador
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      # Experimental: instala a extensão "Claude" (Claude in Chrome) pela política do Chrome. Desligada por padrão.
      ATRIA_BROWSER_CLAUDE_EXTENSION: ${ATRIA_BROWSER_CLAUDE_EXTENSION:-0}
      ATRIA_BROWSER_CLAUDE_EXTENSION_ID: ${ATRIA_BROWSER_CLAUDE_EXTENSION_ID:-}
    volumes:
      - browser-profile:/profile
      - workspace:/workspace
    shm_size: "1gb"
    mem_limit: 1536m
    labels:
      - traefik.enable=false

  # VS Code open source para o Vault e os projetos. Sem porta pública nem Traefik: o serviço atria
  # checa a sessão e repassa /code (HTTP + WebSocket). Mesmo uid (1000) do serviço atria no volume.
  atria-code:
    image: ${ATRIA_REGISTRY:-ghcr.io/eliveutonsouza}/atria-code:${ATRIA_TAG:-latest}
    restart: unless-stopped
    volumes:
      - workspace:/workspace
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    mem_limit: 1536m
    cpus: "1.5"
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=false

  # Base de conhecimento da Empresa: documentos, páginas, trechos e campos extraídos (Postgres),
  # vetores (Qdrant) e leitura/OCR de arquivos (Docling). Tudo interno, sem porta pública.
  atria-postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    # Usuário/banco "yui" ficam assim de propósito: são gravados quando o volume nasce e os dados
    # de instalações antigas são copiados como estão.
    environment:
      POSTGRES_USER: yui
      POSTGRES_DB: yui
      POSTGRES_PASSWORD: ${ATRIA_PG_PASSWORD:?defina ATRIA_PG_PASSWORD (instalação antiga com YUI_* = rode ./install.sh --update de novo)}
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yui -d yui"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    labels:
      - traefik.enable=false

  atria-qdrant:
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${ATRIA_QDRANT_KEY:?defina ATRIA_QDRANT_KEY (instalação antiga com YUI_* = rode ./install.sh --update de novo)}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant:/qdrant/storage
    mem_limit: 768m
    labels:
      - traefik.enable=false

  atria-docling:
    image: quay.io/docling-project/docling-serve-cpu@sha256:225c8586e20d5d0fc6811a9e0e044fa602bcc4393f00389009bad42d6787b58f
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_MAX_SYNC_WAIT: "600"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      OMP_NUM_THREADS: "2"
    mem_limit: 3g
    cpus: "2.0"
    labels:
      - traefik.enable=false

  # TLS automático para VPS sem proxy próprio (profile "edge", ativado pelo install.sh quando não há Traefik).
  # Com Traefik já rodando no host, este serviço fica desligado e valem as labels do serviço atria.
  atria-caddy:
    image: caddy:2.11-alpine
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ATRIA_DOMAIN: ${ATRIA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - atria
    mem_limit: 128m
    labels:
      - traefik.enable=false

  # Atualizador (profile "updater", ligado pelo deploy/install-release.sh): troca ATRIA_TAG no .env, puxa e
  # recria atria/atria-code e volta para a tag anterior se não ficar saudável em 3 min. Só na rede interna,
  # com token (ATRIA_UPDATER_TOKEN). Tem o socket do Docker e a pasta do compose montada no MESMO caminho do
  # host (ATRIA_STACK_DIR), para os caminhos relativos do compose (./browser, ./Caddyfile) continuarem certos.
  atria-updater:
    image: ${ATRIA_REGISTRY:-ghcr.io/eliveutonsouza}/atria-updater:${ATRIA_TAG:-latest}
    profiles: ["updater"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      ATRIA_UPDATER_TOKEN: ${ATRIA_UPDATER_TOKEN:-}
      GHCR_USER: ${GHCR_USER:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      ATRIA_PROJECT: ${ATRIA_PROJECT:-atria-os}
      ATRIA_STACK_DIR: ${ATRIA_STACK_DIR:-/opt/atria-os}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ATRIA_STACK_DIR:-/opt/atria-os}:${ATRIA_STACK_DIR:-/opt/atria-os}
      - updater-state:/state
    expose:
      - "8787"
    # com atualização em andamento ele termina o job antes de sair
    stop_grace_period: 10m
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=false

  # Docker API somente leitura (lista containers + logs) para Infra/Logs. O app nunca recebe o socket.
  atria-dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    labels:
      - traefik.enable=false

volumes:
  pg:
  qdrant:
  caddy-data:
  caddy-config:
  data:
  workspace:
  browser-profile:
  updater-state:
