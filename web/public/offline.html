<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070d"><title>Atria OS · sem conexão</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 28%,#0f1533 0%,#0a0c1d 45%,#06070d 100%);color:#e8eaf4;font-family:Manrope,system-ui,sans-serif}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.orb{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff,#67d8f2 30%,rgba(166,140,247,.75) 72%,rgba(166,140,247,0));box-shadow:0 0 80px rgba(103,216,242,.25);animation:b 3.2s ease-in-out infinite}
@keyframes b{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
.e{font-size:11px;letter-spacing:.32em;color:#9aa0bb;font-weight:600}
h1{margin:0;font-weight:300;font-size:26px}
p{margin:0;color:#9aa0bb;font-size:15px;max-width:340px;line-height:1.5}
button{margin-top:8px;height:40px;padding:0 18px;border-radius:12px;border:none;background:linear-gradient(135deg,#67d8f2,#a68cf7);color:#0a0c1d;font-weight:700;cursor:pointer}
</style>
</head>
<body><main>
<div class="orb"></div><div class="e">ATRIA OS · SEM CONEXÃO</div>
<h1>Estou sem rede agora.</h1>
<p>Assim que a conexão voltar eu retomo daqui. Seus agentes continuam trabalhando no servidor.</p>
<button onclick="location.reload()">Tentar de novo</button>
</main>
<script>addEventListener('online',()=>location.reload())</script>
</body></html>
