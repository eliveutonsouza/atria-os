# Verificação a cada push/PR: tipos, testes, lint, build do painel, compose válido e imagem Docker que compila.
# Não publica imagem: a instalação builda na própria VPS (./install.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server:
    name: Servidor (tipos + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node --test test/*.test.ts
        env:
          TZ: America/Sao_Paulo

  web:
    name: Painel (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker (compose + imagens)
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - name: compose válido nos três modos de proxy
        run: |
          cp .env.example .env
          printf 'YUI_PG_PASSWORD=ci\nYUI_QDRANT_KEY=ci\nSESSION_SECRET=ci\n' >> .env
          docker compose config -q
          COMPOSE_PROFILES=edge docker compose config -q
          COMPOSE_FILE=docker-compose.yml:docker-compose.port.yml docker compose config -q
          bash -n install.sh scripts-deploy.sh
      - uses: docker/setup-buildx-action@v3
      - name: imagem yui-console
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console
      - name: imagem yui-code
        uses: docker/build-push-action@v6
        with:
          context: ./code
          push: false
          cache-from: type=gha,scope=code
          cache-to: type=gha,mode=max,scope=code
