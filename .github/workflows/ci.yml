# Verificação a cada push/PR: tipos, testes, lint, build do painel, compose válido e imagens Docker que compilam.
# Não publica imagem: isso é do release.yml (tag vX.Y.Z → GHCR + GitHub Release).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server:
    name: Servidor (tipos + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node --test test/*.test.ts
        env:
          TZ: America/Sao_Paulo

  updater:
    name: Atualizador (tipos + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: updater
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: updater/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node --test test/*.test.ts

  web:
    name: Painel (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker (compose + imagens)
    runs-on: ubuntu-latest
    needs: [server, web, updater]
    steps:
      - uses: actions/checkout@v4
      - name: compose válido nos três modos de proxy, por imagem e a partir do código
        run: |
          cp .env.example .env
          printf 'ATRIA_PG_PASSWORD=ci\nATRIA_QDRANT_KEY=ci\nSESSION_SECRET=ci\n' >> .env
          for build in "" ":docker-compose.build.yml"; do
            COMPOSE_FILE=docker-compose.yml$build docker compose config -q
            COMPOSE_FILE=docker-compose.yml$build COMPOSE_PROFILES=edge,updater docker compose config -q
            COMPOSE_FILE=docker-compose.yml:docker-compose.port.yml$build COMPOSE_PROFILES=updater docker compose config -q
            ATRIA_OLD_DOMAIN=old.example.com COMPOSE_FILE=docker-compose.yml:docker-compose.redirect.yml$build COMPOSE_PROFILES=updater docker compose config -q
          done
          # modo imagem puxa do GHCR; o override do código troca por imagens :local
          ATRIA_TAG=v1.2.3 COMPOSE_PROFILES=updater docker compose config --images | grep -q 'atria-updater:v1.2.3'
          COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml docker compose config --images | grep -q 'atria-os:local'
          bash -n install.sh scripts-deploy.sh deploy/install-release.sh
      - uses: docker/setup-buildx-action@v3
        with:
          # Docker Hub limita downloads anônimos dos runners (429): busca pelo espelho do Google, que cai no Hub se faltar
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: imagem atria
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=atria
          cache-to: type=gha,mode=max,scope=atria
      - name: imagem atria-code
        uses: docker/build-push-action@v6
        with:
          context: ./code
          push: false
          cache-from: type=gha,scope=code
          cache-to: type=gha,mode=max,scope=code
      - name: imagem atria-updater
        uses: docker/build-push-action@v6
        with:
          context: .
          file: updater/Dockerfile
          push: false
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater
